<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter — Task 3 | Asmita Patil</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="converter-wrapper">
    <div class="converter-card">
      <div class="card-header">
        <span class="badge">OASIS INFOBYTE SIP • LEVEL 1</span>
        <h1>Temperature Converter</h1>
        <p class="desc">Enter a temperature value, pick the units, and convert instantly.</p>
      </div>

      <div class="converter-body">
        <!-- Input Value -->
        <div class="input-group">
          <label for="tempInput">Degrees / Value</label>
          <input type="number" id="tempInput" placeholder="e.g. 100" step="any" autofocus>
        </div>

        <!-- Select Units -->
        <div class="select-grid">
          <div class="input-group">
            <label for="fromUnit">From</label>
            <select id="fromUnit">
              <option value="celsius" selected>Celsius (°C)</option>
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>

          <button id="swapBtn" class="swap-btn" title="Swap Units" aria-label="Swap units">⇄</button>

          <div class="input-group">
            <label for="toUnit">To</label>
            <select id="toUnit">
              <option value="celsius">Celsius (°C)</option>
              <option value="fahrenheit" selected>Fahrenheit (°F)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
          <button id="convertBtn" class="btn btn-primary">Convert Temperature</button>
          <button id="resetBtn" class="btn btn-secondary">Reset</button>
        </div>

        <!-- Result Box -->
        <div id="resultBox" class="result-box" style="display: none;">
          <span class="result-label">CONVERTED RESULT</span>
          <div id="resultValue" class="result-value">--</div>
          <div id="formulaExplanation" class="formula-text">--</div>
        </div>
      </div>

      <div class="card-footer">
        <p>Developed by <strong>Asmita Atmaram Patil</strong></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
